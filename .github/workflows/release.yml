# Sestaví instalátor na serveru.
#  - push tagu vX.Y.Z  -> GitHub Release s instalátorem (tag vytvoří: pwsh .github/scripts/Release.ps1)
#  - ruční spuštění    -> instalátor jako artefakt běhu (bez releasu)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Verify (versions, tests)
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./.github/scripts/Check-Versions.ps1 -Tag $tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./.github/scripts/Verify-Local.ps1 -SkipBuild

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/Build-Installer.ps1

      - name: Upload installer (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: TimeTrek-installer
          path: target/release/bundle/nsis/*.exe

      - name: Publish release (tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          gh release create '${{ github.ref_name }}' $installer --title "TimeTrek ${{ github.ref_name }}" --generate-notes
