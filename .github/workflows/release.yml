# Sestaví instalátor na serveru.
#  - push tagu vX.Y.Z  -> GitHub Release s instalátorem (tag vytvoří: pwsh .github/scripts/Release.ps1)
#  - ruční spuštění    -> instalátor jako artefakt běhu (bez releasu)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify (versions, types, tests)
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./.github/scripts/Check-Versions.ps1 -Tag $tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./.github/scripts/Verify-Local.ps1 -SkipBuild

      - name: Build installer
        run: npx tauri build

      - name: Upload installer (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrek-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release (tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          gh release create '${{ github.ref_name }}' $installer --title "TimeTrek ${{ github.ref_name }}" --generate-notes
