# Kontroly na serveru: shoda verzí, překlad (včetně UI) a testy.
# Repozitář je veřejný, takže minuty Actions jsou zdarma. Totéž lze pustit lokálně:
#   pwsh .github/scripts/Verify-Local.ps1
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Novější push ruší rozběhnutý starší běh téže větve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Verify
        shell: pwsh
        run: ./.github/scripts/Verify-Local.ps1
