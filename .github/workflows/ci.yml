# Kontroly na serveru: shoda verzí, typy, build frontendu a testy.
# Repozitář je veřejný, takže minuty Actions jsou zdarma. Totéž lze pustit lokálně:
#   pwsh .github/scripts/Verify-Local.ps1
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Novější push ruší rozběhnutý starší běh téže větve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify
        shell: pwsh
        run: ./.github/scripts/Verify-Local.ps1
