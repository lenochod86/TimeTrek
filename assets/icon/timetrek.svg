<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cffb0"/>
      <stop offset="1" stop-color="#18a4ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0e2a2c"/>
      <stop offset="1" stop-color="#04080b"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="#1d3a3d" stroke-width="6"/>

  <!-- orbit ring with gap (glow + crisp) -->
  <g transform="rotate(-62 512 512)">
    <circle cx="512" cy="512" r="368" fill="none" stroke="url(#ring)" stroke-width="44"
            stroke-linecap="round" stroke-dasharray="1750 560" filter="url(#glow)" opacity="0.7"/>
    <circle cx="512" cy="512" r="368" fill="none" stroke="url(#ring)" stroke-width="40"
            stroke-linecap="round" stroke-dasharray="1750 560"/>
  </g>

  <!-- inner tick ring (clock marks) -->
  <circle cx="512" cy="512" r="292" fill="none" stroke="#2cffb0" stroke-opacity="0.45" stroke-width="16"
          stroke-dasharray="5 46"/>

  <!-- stylised T: crossbar + stem -->
  <g filter="url(#glow)" opacity="0.8" fill="#2cffb0">
    <rect x="330" y="360" width="364" height="64" rx="18"/>
    <rect x="480" y="424" width="64" height="250" rx="18"/>
  </g>
  <g fill="url(#ring)">
    <rect x="330" y="360" width="364" height="64" rx="18"/>
    <rect x="480" y="424" width="64" height="250" rx="18"/>
  </g>

  <!-- orbiting "planet" at the end of the ring gap -->
  <g transform="rotate(-62 512 512)">
    <circle cx="880" cy="512" r="46" fill="#bff7ff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="880" cy="512" r="34" fill="#eafffb"/>
  </g>
</svg>
